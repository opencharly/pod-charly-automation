charly-automation:
    candy:
        description: |-
            RETIRED concept candy. It owns no `skill:` and no `agent` entity any more: the
            eight skill bodies and the one sub-agent definition it carried have moved beside
            the command, plugin and image each of them documents (opencharly/opencharly#600,
            #628), and every body is byte-identical at its destination. This repo authors no
            prose.

            It stays a real `candy:` node because a project needs one, and it carries a `true`
            no-op `run:` step and a `true` no-op `check:` step. NEITHER is an assertion: there
            is no body left here for the body-existence gate to resolve, so a step that read
            `true` would assert nothing about anything. `charly box validate` proves the drain
            instead — a node re-added here with no body is red, and it names the node and the
            owning candy.
        plan:
            - run: this retired concept candy ships no install content and owns no entity — a no-op, not a claim
              command: "true"
              context:
                - build
            - check: no-op — the candy owns no `skill:` or `agent` node any more, so there is no body to resolve and nothing this step could assert
              id: charly-automation-retired-no-op
              context:
                - build
              command: "true"
