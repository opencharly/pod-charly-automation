charly-automation:
    candy:
        description: |-
            Concept candy owning the charly-automation skills (tmux/alias/udev/encryption/sidecar/…). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the automation concept candy's skill entities are present and generated into the marketplace's automation/skills
              id: charly-automation-present
              context:
                - build
              command: "true"

agent-skill:
    skill:
        name: agent
        family: automation
        owner: charly-automation
        triggers:
            - "`charly agent` / agent control plane / sessions / runs / terminal channels / `charly tui` / MCP routing / agent target routing"

alias-skill:
    skill:
        name: alias
        family: automation
        owner: charly-automation
        triggers:
            - "host command alias / `charly alias` / wrapper script in a container"

enc-skill:
    skill:
        name: enc
        family: automation
        owner: charly-automation
        triggers:
            - "`charly config` encrypted volumes / gocryptfs / the `--encrypt` flag / config mount-unmount-status-passwd"

openclaw-deploy-skill:
    skill:
        name: openclaw-deploy
        family: automation
        owner: charly-automation
        triggers:
            - "OpenClaw gateway / the OpenClaw family's candies / model auth / browser integration / channel setup"

sidecar-skill:
    skill:
        name: sidecar
        family: automation
        owner: charly-automation
        triggers:
            - "sidecars via `charly config` / Tailscale exit nodes / `env_accept` / `env_require` / pod networking"

tmux-skill:
    skill:
        name: tmux
        family: automation
        owner: charly-automation
        triggers:
            - "`charly tmux` sessions / terminal channels / snapshot / transcript / detached-reattach / gRPC terminal"

udev-skill:
    skill:
        name: udev
        family: automation
        owner: charly-automation
        triggers:
            - "`charly udev` / GPU device access rules / container GPU troubleshooting"

agent-control-operator-skill:
    skill:
        type: agent
        name: agent-control-operator
        family: automation
        owner: charly-automation
        model: inherit
crabbox-deploy-skill:
    skill:
        name: crabbox-deploy
        family: automation
        owner: charly-automation
        triggers:
            - "crabbox CLI / local coordinator / remote-execution broker / composing the crabbox candies"

